<section class="screen" id="screen-form">
  <div class="q-title">
    Fast geschafft — wohin dürfen wir dein Ergebnis schicken?
  </div>

  <p style="color:var(--ink-dim); font-size:15px; margin-top:-10px;">
    Du bekommst hier sofort deinen Antriebs-Typ angezeigt und zusätzlich per E-Mail.
  </p>

  <div class="form-block">

    <div class="field">
      <label for="fName">Vorname</label>
      <input
        type="text"
        id="fName"
        placeholder="Dein Vorname"
        autocomplete="given-name"
      >
    </div>

    <div class="field">
      <label for="fEmail">E-Mail</label>
      <input
        type="email"
        id="fEmail"
        placeholder="du@beispiel.ch"
        autocomplete="email"
      >
    </div>

    <div class="field">
      <label for="fPhone">Telefonnummer</label>
      <input
        type="tel"
        id="fPhone"
        placeholder="+41 79 000 00 00"
        autocomplete="tel"
      >
    </div>

  </div>

  <button
    class="btn-primary"
    id="submitBtn"
    onclick="submitForm()"
  >
    Mein Ergebnis anzeigen
  </button>

  <p class="fine-print">
    Deine Angaben nutzen wir ausschließlich, um dir dein Ergebnis
    und passende Infos zu Bewegung, Ernährung und Wohlbefinden zuzuschicken.
  </p>
</section>
